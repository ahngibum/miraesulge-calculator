<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1T5GDGTWV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z1T5GDGTWV'); 
    </script>

    <meta name="google-site-verification" content="cWFxIon7qS5Gk8MmrZbPi5_3BgRViz_LARaZF3qp_Xo" />

    <title>마이페이지 - AI 노후 설계 연구소</title>
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root { 
            --primary-color: #1a73e8; 
            --primary-dark: #1557b0; 
            --text-dark: #202124; 
            --bg-color: #f8f9fa; 
            --danger-color: #d32f2f;
        }
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            color: var(--text-dark); 
            line-height: 1.6; 
            
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        
        .navbar { 
            background-color: white; 
            border-bottom: 1px solid #eee; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            padding: 10px 0; 
            padding-top: env(safe-area-inset-top);
        }

        .nav-container {
            max-width: 1000px; 
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            flex-wrap: wrap; 
        }

        .logo { 
            font-size: 1.3rem; 
            font-weight: 900; 
            color: var(--primary-color); 
            text-decoration: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center;
        }
        
        .beta-badge {
            display: inline-block;
            font-size: 0.7rem;
            background-color: #ffd600; 
            color: #000; 
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 10px;
            font-weight: 900;
            vertical-align: middle;
            border: 1px solid #e6b800; 
            white-space: nowrap;
        }

        .nav-links { display: flex; gap: 10px; }
        .nav-btn { padding: 8px 18px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1px solid #ddd; background: #fff; transition: 0.2s; }
        .nav-btn:hover { background: #f1f3f4; }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 30px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        .report-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .report-card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #eee; transition: 0.3s; }
        .report-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        
        .card-header { font-size: 0.85rem; color: #888; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card-asset { font-size: 1.4rem; font-weight: 800; color: #333; margin-bottom: 5px; }
        .card-desc { font-size: 0.95rem; color: #666; margin-bottom: 20px; line-height: 1.4; }
        
        .card-footer { display: flex; gap: 10px; }
        .btn-view { flex: 2; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-view:hover { background-color: var(--primary-dark); }
        .btn-delete { flex: 1; padding: 12px; background-color: #fff; color: var(--danger-color); border: 1px solid var(--danger-color); border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background-color: #fff5f5; }

        .empty-msg { text-align: center; color: #999; padding: 50px; font-size: 1.1rem; }

        @media (max-width: 768px) {
            .nav-container { justify-content: center !important; text-align: center; gap: 8px; }
            .logo { width: 100%; justify-content: center; margin-bottom: 5px; }
            .nav-links { width: 100%; justify-content: center; }
            .nav-btn { padding: 6px 12px; font-size: 0.8rem; }
            .navbar { padding: 10px 0; padding-top: env(safe-area-inset-top); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                AI 노후 설계 연구소 <span class="beta-badge">무료베타버전</span>
            </a>
            <div class="nav-links">
                <button class="nav-btn" onclick="location.href='mypage.html'">마이페이지</button>
                <button class="nav-btn" id="btn-logout">로그아웃</button>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <h2 class="page-title" id="user-display">나의 진단 기록</h2>
        <div class="report-list" id="report-list"><p class="empty-msg">데이터를 불러오는 중...</p></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBJJshV9s_0wTNK_KM4moBC2qG_E8xErKo", 
            authDomain: "www.myaicfo.co.kr", 
            projectId: "nojunge-9ebbb", 
            storageBucket: "nojunge-9ebbb.firebasestorage.app", 
            messagingSenderId: "817970933502", 
            appId: "1:817970933502:web:c1cebcaf10cdc681bb3faf" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { location.href='login.html'; return; }

            const now = Date.now();
            const lastVisit = localStorage.getItem('last_visit_time');
            const TEN_MINUTES = 10 * 60 * 1000;
            if (!lastVisit || (now - lastVisit > TEN_MINUTES)) {
                signOut(auth).then(() => { localStorage.removeItem('last_visit_time'); location.href='login.html'; });
                return;
            }
            localStorage.setItem('last_visit_time', now);
            
            const userId = user.email.split('@')[0];
            document.getElementById('user-display').innerText = `${userId}님 의 진단 기록`;
            
            document.getElementById('btn-logout').onclick = () => { 
                if(confirm("로그아웃 하시겠습니까?")) {
                    signOut(auth).then(() => { localStorage.removeItem('last_visit_time'); location.href='index.html'; });
                }
            };
            
            const q = query(collection(db, "reports"), where("uid", "==", user.uid), orderBy("created_at", "desc"));
            const snapshot = await getDocs(q);
            const list = document.getElementById('report-list');
            list.innerHTML = "";
            
            if(snapshot.empty) { 
                list.innerHTML = `<p class="empty-msg">아직 저장된 진단 결과가 없습니다.</p>`; 
                return; 
            }
            
            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                const totalAsset = Number(d.input.real_estate || 0) + Number(d.input.cash_asset || 0);
                const card = document.createElement('div'); 
                card.className='report-card';
                card.innerHTML = `
                    <div class="card-header"><span>📅 ${d.date_str}</span></div>
                    <div class="card-asset">${totalAsset.toLocaleString()}만원</div>
                    <div class="card-desc">거주지: ${d.input.location}<br>생활비: ${Number(d.input.retirement_living_cost).toLocaleString()}만원</div>
                    <div class="card-footer">
                        <button class="btn-view" onclick='viewReport(${JSON.stringify(d.input)})'>결과 보기</button>
                        <button class="btn-delete" onclick="deleteReport('${docSnap.id}')">삭제</button>
                    </div>
                `;
                list.appendChild(card);
            });
        });

        window.deleteReport = async (docId) => {
            if (confirm("기록을 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "reports", docId));
                    alert("기록이 성공적으로 삭제되었습니다.");
                    location.reload(); 
                } catch (e) { alert("삭제 실패: " + e.message); }
            }
        };

        window.viewReport = (data) => { 
            localStorage.setItem('simulationInput', JSON.stringify(data)); 
            localStorage.setItem('simulationViewMode', 'interactive'); 
            location.href='result.html'; 
        };
    </script>
</body>
</html>
