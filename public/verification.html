<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 노후준비 - 상세 검증 대시보드</title>
    <style>
        :root {
            --primary: #1a73e8;
            --border: #ddd;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg);
            font-size: 14px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        /* Left Panel */
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .control-panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group .row {
            display: flex;
            gap: 5px;
        }

        button#btn-run {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 1rem;
        }

        button#btn-run:hover {
            background: #1557b0;
        }

        /* AI Cards */
        .ai-cards-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .ai-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .ai-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .ai-card.selected {
            border: 2px solid var(--primary);
            background: #e3f2fd;
        }

        .ai-card h4 {
            margin: 0 0 5px 0;
            color: #333;
            font-size: 1rem;
            font-weight: bold;
        }

        .ai-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
        }

        .ai-card .badge-rec {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffca28;
            color: #333;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Right Panel */
        .result-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th,
        td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            text-align: right;
            white-space: nowrap;
        }

        th {
            background: #e3f2fd;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 10;
            text-align: center;
            font-weight: 700;
        }

        .col-age {
            background: #f5f5f5;
            text-align: center;
            position: sticky;
            left: 0;
            z-index: 5;
            font-weight: bold;
        }

        .col-inc {
            background: #e8f5e9;
        }

        .col-exp {
            background: #ffebee;
        }

        .col-net {
            background: #e0f7fa;
            font-weight: bold;
        }

        .col-asset {
            background: #fff3e0;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-size: 0.75rem;
            margin-right: 5px;
        }

        .bg-blue {
            background: #1976d2;
        }

        .bg-red {
            background: #d32f2f;
        }

        .bg-green {
            background: #388e3c;
        }

        .negative {
            color: #d32f2f;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Controls -->
        <div class="control-panel">
            <h2>🏗️ 시뮬레이션 설정</h2>

            <div class="form-group">
                <label>출생연도 (남편 / 아내)</label>
                <div class="row">
                    <input type="number" id="h_year" value="1974">
                    <input type="number" id="w_year" value="1976">
                </div>
            </div>

            <div class="form-group">
                <label>자산 현황 (단위: 만원)</label>
                <input type="number" id="real_estate" placeholder="부동산" value="80000">
                <input type="number" id="cash_asset" placeholder="현금자산" value="10000" style="margin-top:5px;">
            </div>

            <div class="form-group">
                <label>현재 소득/지출 (월, 만원)</label>
                <input type="number" id="current_income" placeholder="수입" value="600">
                <input type="number" id="current_expense" placeholder="지출" value="500" style="margin-top:5px;">
            </div>

            <div class="form-group">
                <label>은퇴 설정</label>
                <div class="row">
                    <input type="number" id="target_retirement_age" placeholder="은퇴나이" value="60">
                    <input type="number" id="retirement_living_cost" placeholder="은퇴후 생활비" value="300">
                </div>
            </div>

            <div class="form-group">
                <label>예상 연금액 (월, 만원)</label>
                <div class="row">
                    <input type="number" id="h_np_amt" placeholder="남편 국민연금" value="150">
                    <input type="number" id="w_np_amt" placeholder="아내 국민연금" value="100">
                </div>
                <div class="row" style="margin-top:5px;">
                    <input type="number" id="h_pp_amt" placeholder="개인연금(부)" value="0">
                    <input type="number" id="w_pp_amt" placeholder="개인연금(처)" value="0">
                </div>
            </div>

            <!-- Scenario Select Removed -->
            <input type="hidden" id="scenario_select" value="1">

            <button id="btn-run">검증 실행 (Run)</button>
            <button id="btn-optimize" style="background:#ffca28; color:#333; margin-top:10px;">🤖 AI 솔루션 찾기</button>

            <!-- AI Strategies Area -->
            <div id="ai-strategies-area"
                style="display:none; margin-top:20px; border-top:1px solid #eee; padding-top:20px;">
                <h3 style="margin:0 0 10px 0; font-size:1.1rem;">💡 AI 추천 생존 전략</h3>
                <p style="margin:0 0 15px 0; font-size:0.9rem; color:#666;">원하시는 전략 카드를 클릭하여 시뮬레이션 결과를 확인하세요.</p>
                <div id="ai-cards-box" class="ai-cards-container">
                    <!-- Cards injected here -->
                </div>
            </div>
        </div>

        <!-- Results -->
        <div class="result-panel">
            <div style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0;">📊 연도별 상세 데이터 검증 (Year-by-Year)</h3>
                <small style="color:#666;">* 금액 단위: 만원</small>
            </div>
            <table>
                <thead>
                    <tr>
                        <th rowspan="2" class="col-age">나이<br>(Husband)</th>
                        <th rowspan="2">연도</th>
                        <th rowspan="2">이벤트</th>
                        <th colspan="6" style="background:#e8f5e9;">수입 (Income)</th>
                        <th colspan="3" style="background:#ffebee;">지출 (Expense)</th>
                        <th rowspan="2" class="col-net">순수지<br>(Net)</th>
                        <th colspan="2" style="background:#fff3e0;">자산 잔액 (Asset)</th>
                    </tr>
                    <tr>
                        <th class="col-inc">근로</th>
                        <th class="col-inc">국민</th>
                        <th class="col-inc">퇴직</th>
                        <th class="col-inc">개인</th>
                        <th class="col-inc">주택</th>
                        <th class="col-inc">기초</th>

                        <th class="col-exp">생활비</th>
                        <th class="col-exp">건보료</th>
                        <th class="col-exp">기타</th>

                        <th class="col-asset">현금</th>
                        <th class="col-asset">부동산</th>
                    </tr>
                </thead>
                <tbody id="result-tbody">
                    <tr>
                        <td colspan="15" style="text-align:center; padding:50px;">'검증 실행' 버튼을 눌러주세요.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { SimulationEngine } from './js/logic/simulation_engine.js';
        import { Optimizer } from './js/logic/optimizer.js';

        const $ = (id) => document.getElementById(id);
        const val = (id) => Number($(id).value) || 0;
        const fmt = (n) => Math.round(n).toLocaleString();

        let currentStrategies = [];

        $('btn-run').addEventListener('click', () => {
            const inputData = getInputData();
            const results = SimulationEngine.run(inputData);
            const targetCase = results.find(r => r.id === 1); // Default to Case 1

            $('ai-strategies-area').style.display = 'none';
            renderTable(targetCase.log, inputData);
        });

        $('btn-optimize').addEventListener('click', () => {
            const inputData = getInputData();
            const result = Optimizer.findAllSolutions(inputData);

            if (result.status === 'SAFE') {
                alert("현재 상태로도 충분히 안전합니다! 별도의 솔루션이 필요 없습니다.");
                return;
            }

            if (result.status === 'FAILED') {
                alert("죄송합니다. 현재 조건으로는 해결책을 찾기 어렵습니다.");
                return;
            }

            currentStrategies = result.strategies;
            renderStrategies(currentStrategies);
        });

        function renderStrategies(strategies) {
            const container = $('ai-cards-box');
            container.innerHTML = '';
            $('ai-strategies-area').style.display = 'block';

            strategies.forEach((strategy, idx) => {
                const card = document.createElement('div');
                card.className = 'ai-card';
                card.innerHTML = `
                <h4>${strategy.title}</h4>
                <p style="font-weight:bold; color:#1a73e8; margin-bottom:5px;">${strategy.summary}</p>
                <p>${strategy.description}</p>
             `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.ai-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');

                    const results = SimulationEngine.run(strategy.input);
                    const targetCase = results.find(r => r.id === strategy.targetScenarioId);
                    renderTable(targetCase.log, strategy.input);
                });

                container.appendChild(card);
            });
        }

        function renderTable(log, input) {
            const tbody = $('result-tbody');
            tbody.innerHTML = '';

            log.forEach(row => {
                const currentYear = new Date().getFullYear() + (row.age - (new Date().getFullYear() - input.h_year));

                let events = [];
                if (row.age === input.target_retirement_age) events.push(`<span class="badge bg-red">은퇴</span>`);
                if (row.incomes.np > 0 && (!log.find(p => p.age === row.age - 1) || log.find(p => p.age === row.age - 1).incomes.np === 0)) events.push(`<span class="badge bg-blue">연금개시</span>`);
                if (row.healthIns && row.healthIns.status.includes('전환') && (!log.find(p => p.age === row.age - 1) || !log.find(p => p.age === row.age - 1).healthIns.status.includes('전환'))) events.push(`<span class="badge bg-green">건보전환</span>`);

                const tr = document.createElement('tr');

                const healthFee = row.healthIns ? row.healthIns.fee * 12 : 0;
                const net = row.incomes.total - row.expense - healthFee;

                if (net < 0) tr.style.color = '#c62828';

                tr.innerHTML = `
                <td class="col-age">${row.age}세</td>
                <td style="text-align:center; color:#777;">${currentYear}</td>
                <td style="text-align:left;">${events.join('')}</td>
                
                <td>${fmt(row.incomes.labor)}</td>
                <td>${fmt(row.incomes.np)}</td>
                <td>${fmt(row.incomes.rp)}</td>
                <td>${fmt(row.incomes.pp)}</td>
                <td>${fmt(row.incomes.home)}</td>
                <td style="color:#1565c0; font-weight:bold;">${fmt(row.incomes.basic)}</td>
                
                <td>${fmt(row.expense)}</td>
                <td style="color:#c62828;">${fmt(healthFee)}</td>
                <td>0</td>

                <td class="col-net" style="${net < 0 ? 'color:red' : ''}">${fmt(net)}</td>
                
                <td style="font-weight:bold; ${row.endCash < 0 ? 'color:red;' : ''}">${fmt(row.endCash)}</td>
                <td style="color:#aaa;">${fmt(row.estate)}</td>
            `;
                tbody.appendChild(tr);
            });
        }

        function getInputData() {
            return {
                h_year: val('h_year'), w_year: val('w_year'),
                location: '수도권',
                real_estate: val('real_estate'), cash_asset: val('cash_asset'),
                current_income: val('current_income'), current_expense: val('current_expense'),
                target_retirement_age: val('target_retirement_age'), retirement_living_cost: val('retirement_living_cost'),
                h_np_amt: val('h_np_amt'), w_np_amt: val('w_np_amt'),
                h_pp_amt: val('h_pp_amt'), w_pp_amt: val('w_pp_amt'),
                housingType: 'owned', monthlyRentCost: 0,
                h_rp_amt: 0, w_rp_amt: 0,
                h_pp_dur: 10, w_pp_dur: 10
            };
        }
    </script>

</body>

</html>
