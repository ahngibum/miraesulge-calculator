        .btn-retry { background-color: #f1f3f4; color: #333; border: 1px solid #ddd; }

        @media screen and (max-width: 768px) {

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBJJshV9s_0wTNK_KM4moBC2qG_E8xErKo", 
            authDomain: "www.myaicfo.co.kr", 
            projectId: "nojunge-9ebbb", 
            storageBucket: "nojunge-9ebbb.firebasestorage.app", 
            messagingSenderId: "817970933502", 
            appId: "1:817970933502:web:c1cebcaf10cdc681bb3faf" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const navArea = document.getElementById('nav-auth-area');
            const btnArea = document.querySelector('.btn-area');
            const viewMode = localStorage.getItem('simulationViewMode'); 

            if (viewMode === 'readonly') {
                if(btnArea) {
                    btnArea.style.display = 'flex';
                    btnArea.innerHTML = `<button class="btn btn-retry" onclick="location.href='retirement_simulator.html'">🔍 타인 조건 조회하기</button>`;
                }
            } else {
                if(btnArea) btnArea.style.display = 'flex';
            }

            if (user) {
                const now = Date.now();
                const lastVisit = localStorage.getItem('last_visit_time');
                const TEN_MINUTES = 10 * 60 * 1000;

                if (!lastVisit || (now - lastVisit > TEN_MINUTES)) {
                    signOut(auth).then(() => {
                        localStorage.removeItem('last_visit_time');
                        alert("세션이 만료되어 로그아웃되었습니다.");
                        location.reload(); 
                    });
                    return;
                }
                localStorage.setItem('last_visit_time', now);

                navArea.innerHTML = `<button class="nav-btn" onclick="location.href='mypage.html'">마이페이지</button><button class="nav-btn" id="btn-logout">로그아웃</button>`;
                document.getElementById('btn-logout').onclick = () => {
                    if(confirm("로그아웃 하시겠습니까?")) {
                        signOut(auth).then(() => {
                            localStorage.removeItem('last_visit_time');
                            alert("로그아웃 되었습니다.");
                            location.href='index.html';
                        });
                    }
                };
            } else {
                navArea.innerHTML = `<button class="nav-btn btn-primary" onclick="location.href='login.html'">로그인</button>`;
            }
        });

        const saveBtn = document.getElementById('btn-save');
        if(saveBtn) {
            saveBtn.addEventListener('click', async () => {
                if (!currentUser) {
                    if(confirm("결과를 저장하려면 로그인이 필요합니다.\n로그인 페이지로 이동하시겠습니까?")) {
                        window.location.href = 'login.html?from=result';
                    }
                    return;
                }
                try {
                    await addDoc(collection(db, "reports"), {
                        uid: currentUser.uid, email: currentUser.email, created_at: serverTimestamp(),
                        // 한국 시간(KST) 기준 날짜 저장 (9시간 더하기)
date_str: new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10).replace(/-/g, '.'),
                        input: window.simulationData, summary: window.simulationSummary || {}
                    });
                    alert("✅ 결과가 성공적으로 저장되었습니다!");
                    window.location.href = 'mypage.html';
                } catch (e) { alert("❌ 저장 실패: " + e.message); }
            });
        }

        const retryBtn = document.getElementById('btn-retry');
        if(retryBtn) {
            retryBtn.addEventListener('click', () => {
                if (!currentUser) {
                    if(confirm("조건을 수정하려면 로그인이 필요합니다.\n로그인 페이지로 이동하시겠습니까?")) {
                        window.location.href = 'login.html?from=result';
                    }
                    return;
                }
                window.location.href = 'retirement_simulator.html';
            });
        }
    </script>

    <script src="calculator.js"></script>

    <script>
        // ✅ 한국 시간(KST) 구하기: 현재 시간 + 9시간
        const nowKST = new Date(Date.now() + 9 * 60 * 60 * 1000);
        
        const currentYear = nowKST.getFullYear();
        document.getElementById('today-date').innerText = nowKST.toISOString().slice(0, 10).replace(/-/g, '.');

        let data = {};
        try { if(localStorage.getItem('simulationInput')) data = JSON.parse(localStorage.getItem('simulationInput')); } catch(e) {}
        if (!data.h_year) data = { h_year: 1969, w_year: 1970, real_estate: 50000, cash_asset: 10000, retirement_living_cost: 300, retirement_job_income: 175 };
        
        window.simulationData = data; 
        const getNum = (v) => { const n = Number(v); return isNaN(n) ? 0 : n; };
        const fmt = (n) => Number(n).toLocaleString();
        
        const hAge = currentYear - getNum(data.h_year);
        const wAge = currentYear - getNum(data.w_year);
        const userJobIncome = getNum(data.retirement_job_income);
        const inputEstate = getNum(data.real_estate); 
        const inputCash = getNum(data.cash_asset);
        const totalAsset = inputEstate + inputCash;
        window.simulationSummary = { h_age: hAge, w_age: wAge, total_asset: totalAsset };

        let housingLabel = "부동산";
        if(data.housingType === 'jeonse') housingLabel = "전세보증금";
        if(data.housingType === 'wolse') housingLabel = "월세보증금";

        document.getElementById('input-summary').innerHTML = `
            <div class="summary-item"><div class="summary-label">👤 인적 사항</div><div class="summary-value">남편 ${data.h_year}년생 (만 ${hAge}세)</div><div class="summary-value">아내 ${data.w_year}년생 (만 ${wAge}세)</div></div>
            <div class="summary-item"><div class="summary-label">🏠 자산 현황</div><div class="summary-value">총 자산 ${fmt(totalAsset)}만원</div><div class="sub-value">${housingLabel} ${fmt(inputEstate)} / 현금 ${fmt(inputCash)}</div></div>
            <div class="summary-item"><div class="summary-label">💰 노후 목표</div><div class="summary-value">월 생활비 ${fmt(data.retirement_living_cost)}만원</div></div>
        `;
        document.getElementById('labor-header').innerHTML = `경제활동 지속<br><span style="font-size:0.8em; font-weight:normal;">(${fmt(userJobIncome)}만원/월, 5년간 추가)</span>`;

        let results = MyAICFO_Engine.runSimulation(data);

        document.getElementById('result-body').innerHTML = Array.from({length: 26}, (_, i) => Math.min(60 + i, 85)).map((age, idx) => {
            const displayAge = 60 + idx;
            if(displayAge > 85) return ''; 
            return `<tr><th>${displayAge}세</th>` + results.map(r => `<td class="${(r.status[displayAge]||'O') === 'O' ? 'status-safe' : 'status-danger'}">${r.status[displayAge]||'O'}</td>`).join('') + `</tr>`
        }).join('');
        
        document.getElementById('result-footer').innerHTML = `<tr class="row-inheritance"><th>조기상속<br>가능여부</th>` + results.map(r => `<td>${r.isInheritanceSafe ? '가능' : '불가'}</td>`).join('') + `</tr>`;
        
        document.getElementById('summary-grid').innerHTML = results.map((r, idx) => `
            <div class="summary-card ${r.isAllSafe ? 'card-blue' : (r.maxAge >= 85 || r.isInheritanceSafe ? 'card-yellow' : 'card-red')}">
                <span class="case-badge ${r.isAllSafe ? 'badge-blue' : (r.maxAge >= 85 || r.isInheritanceSafe ? 'badge-yellow' : 'badge-red')}">CASE ${idx+1}</span>
                <div class="case-text">
                    연금 <span class="text-highlight">${r.config.pension === 'normal' ? '정상수령' : '조기수령'}</span>, <span class="text-highlight">${r.config.liquid ? '이사를 통해 현금화' : '현거주지 유지'}</span>, <span class="text-highlight">${r.config.labor ? '5년간 추가 경제활동' : '은퇴 후 여가생활'}</span>
                    <span class="result-text ${r.isAllSafe ? 'msg-blue' : (r.isDanger ? 'msg-red' : '')}">👉 ${r.maxAge >= 85 ? '85세 이상' : r.maxAge + '세'}까지 통장에 현금 보유</span>
                    <span class="result-text ${r.isAllSafe ? 'msg-blue' : (r.isDanger ? 'msg-red' : '')}">👉 60세 이후 조기상속 가능금액: ${r.finalAmount < 0 ? '없습니다.' : fmt(r.finalAmount) + '만원'}</span>
                </div>
            </div>
        `).join('');
    </script>

            new google.translate.TranslateElement({pageLanguage: 'ko', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');

    </script>

    <script>
        function shareResult() {
            if (navigator.share) {
                navigator.share({
                    title: 'AI 노후설계 결과',
                    text: '나의 노후 준비 상태는? AI가 분석한 시뮬레이션 결과를 확인해보세요.',
                    url: window.location.href,
                })
                .then(() => console.log('공유 성공'))
                .catch((error) => console.log('공유 실패', error));
            } else {
                var dummy   = document.createElement("input");
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                alert("결과 링크가 복사되었습니다.");
            }
        }
    </script>
